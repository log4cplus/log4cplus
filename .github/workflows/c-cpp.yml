name: C/C++ CI

on:
  push:
    branches: [ "2.2.x" ]
  pull_request:
    branches: [ "2.2.x" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - os: 'ubuntu-24.04'
          cc: 'gcc-14'
          cxx: 'g++-14'
          prereq: |
            sudo apt install pkgconf

        # Enable macOS build by installing Boost via Homebrew
        - os: 'macos-15'
          cc: 'clang'
          cxx: 'clang++'
          prereq: |
            sudo xcode-select -s '/Applications/Xcode_16.4.app/Contents/Developer'

        - os: 'macos-15'
          cc: '$(brew --prefix llvm@18)/bin/clang'
          cxx: '$(brew --prefix llvm@18)/bin/clang++'
          prereq: |
            sudo xcode-select -s '/Applications/Xcode_16.4.app/Contents/Developer'

        - os: 'macos-14'
          cc: 'clang'
          cxx: 'clang++'
          prereq: |
            sudo xcode-select -s '/Applications/Xcode_15.4.app/Contents/Developer'

    runs-on: ${{ matrix.config.os }}

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: install prerequisites
      run: |
        ${{ matrix.config.prereq }}
    - name: configure
      run: |
        ${{ matrix.config.cxx }} --version
        ./scripts/fix-timestamps.sh
        mkdir objdir
        cd objdir
        ../configure CPPFLAGS="${{ matrix.config.cppflags }}" \
          CC="${{ matrix.config.cc }}" \
          CXX="${{ matrix.config.cxx }}" \
          ${{ matrix.config.configure_flags }} \
          --enable-shared --enable-unit-tests --with-working-locale
        ./config.status --config
    - name: make
      run: cd objdir ; make
    - name: make check
      run: cd objdir ; make check

  windows-cmake:
    name: CMake / Windows / ${{ matrix.toolset }}
    strategy:
      fail-fast: false
      matrix:
        # v142 preserves the VS 2019 compiler from AppVeyor; v143 matches master.
        toolset: ['v142', 'v143']

    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: configure
      run: >
        cmake
        -S .
        -B objdir
        -G "Visual Studio 17 2022"
        -A x64
        -T ${{ matrix.toolset }}
        -DCMAKE_BUILD_TYPE=Release
    - name: build
      run: cmake --build objdir --config Release
    - name: test
      run: ctest --test-dir objdir --build-config Release --output-on-failure

  windows-msbuild:
    name: MSBuild / Windows / ${{ matrix.toolset }} / ${{ matrix.project }}
    strategy:
      fail-fast: false
      matrix:
        toolset: ['v142', 'v143']
        project: ['log4cplus', 'log4cplusS']

    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: build
      shell: pwsh
      run: |
        $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
          -latest -products '*' -version '[17.0,18.0)' `
          -requires Microsoft.Component.MSBuild `
          -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
        if (-not $msbuild) {
          throw 'Visual Studio 2022 MSBuild was not found.'
        }
        # Override v140 in the checked-in projects to test VS 2019 or VS 2022.
        & $msbuild "msvc14\${{ matrix.project }}.vcxproj" `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:PlatformToolset=${{ matrix.toolset }} `
          /p:WindowsTargetPlatformVersion=10.0 `
          /nologo

  cmake-package-consumer:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shared: ['ON', 'OFF']
        unicode: ['ON', 'OFF']

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Build and install library
      run: |
        cmake -S . -B build/package \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/staging" \
          -DCMAKE_INSTALL_LIBDIR=lib \
          -DBUILD_SHARED_LIBS=${{ matrix.shared }} \
          -DUNICODE=${{ matrix.unicode }} \
          -DLOG4CPLUS_BUILD_TESTING=OFF \
          -DLOG4CPLUS_BUILD_LOGGINGSERVER=OFF \
          -DWITH_UNIT_TESTS=OFF
        cmake --build build/package --parallel 2
        cmake --install build/package
    - name: Build installed-package consumer
      run: |
        cmake -S tests/cmake_package_consumer -B build/consumer \
          -DCMAKE_BUILD_TYPE=Release \
          -Dlog4cplus_DIR="$GITHUB_WORKSPACE/staging/lib/cmake/log4cplus"
        cmake --build build/consumer --parallel 2
