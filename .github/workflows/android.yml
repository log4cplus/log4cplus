name: Android CI

on:
  push:
    branches: [ 2.0.x, 2.1.x, master ]
  pull_request:
    branches: [ 2.0.x, 2.1.x, master ]

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: 29.0.14206865
  ANDROID_PLATFORM: android-21

jobs:
  cross-compile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_abi: armeabi-v7a
            elf_class: ELF32
            elf_machine: ARM
          - target_abi: arm64-v8a
            elf_class: ELF64
            elf_machine: AArch64
          - target_abi: x86
            elf_class: ELF32
            elf_machine: Intel 80386
          - target_abi: x86_64
            elf_class: ELF64
            elf_machine: Advanced Micro Devices X86-64

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Select Android NDK r29
        run: |
          set -euo pipefail
          android_sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ndk_home="$android_sdk_root/ndk/$ANDROID_NDK_VERSION"
          if [[ ! -f "$ndk_home/build/cmake/android.toolchain.cmake" ]]; then
            "$android_sdk_root/cmdline-tools/latest/bin/sdkmanager" \
              "ndk;$ANDROID_NDK_VERSION"
          fi
          test -f "$ndk_home/build/cmake/android.toolchain.cmake"
          printf 'ANDROID_NDK_HOME=%s\n' "$ndk_home" >> "$GITHUB_ENV"
          printf 'ANDROID_READELF=%s\n' \
            "$ndk_home/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            >> "$GITHUB_ENV"
          grep '^Pkg.Revision' "$ndk_home/source.properties"
          cmake --version

      - name: Compile and link tests for ${{ matrix.target_abi }}
        run: |
          set -euo pipefail
          cmake -S . -B build/android-tests -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI=${{ matrix.target_abi }} \
            -DANDROID_PLATFORM="$ANDROID_PLATFORM" \
            -DANDROID_STL=c++_shared \
            -DBUILD_SHARED_LIBS=ON \
            -DLOG4CPLUS_BUILD_TESTING=ON \
            -DWITH_UNIT_TESTS=ON
          grep -q '^LOG4CPLUS_BUILD_LOGGINGSERVER:BOOL=OFF$' \
            build/android-tests/CMakeCache.txt
          cmake --build build/android-tests --parallel 2

      - name: Build and install production library for ${{ matrix.target_abi }}
        run: |
          set -euo pipefail
          install_prefix="$GITHUB_WORKSPACE/staging/${{ matrix.target_abi }}/shared"
          cmake -S . -B build/android-production -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DCMAKE_INSTALL_PREFIX="$install_prefix" \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI=${{ matrix.target_abi }} \
            -DANDROID_PLATFORM="$ANDROID_PLATFORM" \
            -DANDROID_STL=c++_shared \
            -DBUILD_SHARED_LIBS=ON \
            -DLOG4CPLUS_BUILD_TESTING=OFF \
            -DLOG4CPLUS_BUILD_LOGGINGSERVER=OFF \
            -DWITH_UNIT_TESTS=OFF
          cmake --build build/android-production --parallel 2
          cmake --install build/android-production
          test -f "$install_prefix/lib/liblog4cplus.so"
          test ! -e "$install_prefix/bin/loggingserver"

      - name: Validate production ELF for ${{ matrix.target_abi }}
        run: |
          set -euo pipefail
          library="staging/${{ matrix.target_abi }}/shared/lib/liblog4cplus.so"
          header="$($ANDROID_READELF --file-header "$library")"
          dynamic="$($ANDROID_READELF --dynamic "$library")"
          printf '%s\n%s\n' "$header" "$dynamic"

          grep -Eq 'Class:[[:space:]]+${{ matrix.elf_class }}' <<< "$header"
          grep -Eq 'Machine:[[:space:]]+${{ matrix.elf_machine }}' <<< "$header"
          grep -Eq '\(SONAME\).*\[liblog4cplus\.so\]' <<< "$dynamic"
          grep -Eq '\(NEEDED\).*\[libc\+\+_shared\.so\]' <<< "$dynamic"
          grep -Eq '\(NEEDED\).*\[liblog\.so\]' <<< "$dynamic"

          package_dir="staging/${{ matrix.target_abi }}/shared/lib/cmake/log4cplus"
          if grep -R -F "$ANDROID_NDK_HOME" "$package_dir"; then
            echo 'Installed CMake package contains an absolute NDK path' >&2
            exit 1
          fi

      - name: Build installed-package consumer for ${{ matrix.target_abi }}
        run: |
          set -euo pipefail
          install_prefix="$GITHUB_WORKSPACE/staging/${{ matrix.target_abi }}/shared"
          package_dir="$install_prefix/lib/cmake/log4cplus"
          test -f "$package_dir/log4cplusConfig.cmake"
          cmake -S tests/cmake_package_consumer -B build/android-consumer -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -Dlog4cplus_DIR="$package_dir" \
            -DANDROID_ABI=${{ matrix.target_abi }} \
            -DANDROID_PLATFORM="$ANDROID_PLATFORM" \
            -DANDROID_STL=c++_shared
          cmake --build build/android-consumer --parallel 2

          consumer=build/android-consumer/liblog4cplus_consumer.so
          header="$($ANDROID_READELF --file-header "$consumer")"
          dynamic="$($ANDROID_READELF --dynamic "$consumer")"
          printf '%s\n%s\n' "$header" "$dynamic"

          grep -Eq 'Class:[[:space:]]+${{ matrix.elf_class }}' <<< "$header"
          grep -Eq 'Machine:[[:space:]]+${{ matrix.elf_machine }}' <<< "$header"
          grep -Eq '\(NEEDED\).*\[liblog4cplus\.so\]' <<< "$dynamic"
          grep -Eq '\(NEEDED\).*\[libc\+\+_shared\.so\]' <<< "$dynamic"

  static-consumer:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Select Android NDK r29
        run: |
          set -euo pipefail
          android_sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ndk_home="$android_sdk_root/ndk/$ANDROID_NDK_VERSION"
          if [[ ! -f "$ndk_home/build/cmake/android.toolchain.cmake" ]]; then
            "$android_sdk_root/cmdline-tools/latest/bin/sdkmanager" \
              "ndk;$ANDROID_NDK_VERSION"
          fi
          test -f "$ndk_home/build/cmake/android.toolchain.cmake"
          printf 'ANDROID_NDK_HOME=%s\n' "$ndk_home" >> "$GITHUB_ENV"
          printf 'ANDROID_READELF=%s\n' \
            "$ndk_home/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            >> "$GITHUB_ENV"

      - name: Build and install static ARM64 library
        run: |
          set -euo pipefail
          install_prefix="$GITHUB_WORKSPACE/staging/arm64-v8a/static"
          cmake -S . -B build/android-static -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DCMAKE_INSTALL_PREFIX="$install_prefix" \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="$ANDROID_PLATFORM" \
            -DANDROID_STL=c++_static \
            -DBUILD_SHARED_LIBS=OFF \
            -DLOG4CPLUS_BUILD_TESTING=OFF \
            -DLOG4CPLUS_BUILD_LOGGINGSERVER=OFF \
            -DWITH_UNIT_TESTS=OFF
          cmake --build build/android-static --parallel 2
          cmake --install build/android-static
          test -f "$install_prefix/lib/liblog4cplusS.a"

          package_dir="$install_prefix/lib/cmake/log4cplus"
          if grep -R -F "$ANDROID_NDK_HOME" "$package_dir"; then
            echo 'Installed CMake package contains an absolute NDK path' >&2
            exit 1
          fi

      - name: Build and validate static-package consumer
        run: |
          set -euo pipefail
          install_prefix="$GITHUB_WORKSPACE/staging/arm64-v8a/static"
          package_dir="$install_prefix/lib/cmake/log4cplus"
          test -f "$package_dir/log4cplusConfig.cmake"
          cmake -S tests/cmake_package_consumer -B build/android-static-consumer -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -Dlog4cplus_DIR="$package_dir" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="$ANDROID_PLATFORM" \
            -DANDROID_STL=c++_static
          cmake --build build/android-static-consumer --parallel 2

          consumer=build/android-static-consumer/liblog4cplus_consumer.so
          consumer_header="$($ANDROID_READELF --file-header "$consumer")"
          consumer_dynamic="$($ANDROID_READELF --dynamic "$consumer")"
          printf '%s\n%s\n' "$consumer_header" "$consumer_dynamic"

          grep -Eq 'Class:[[:space:]]+ELF64' <<< "$consumer_header"
          grep -Eq 'Machine:[[:space:]]+AArch64' <<< "$consumer_header"
          grep -Eq '\(NEEDED\).*\[liblog\.so\]' <<< "$consumer_dynamic"
          if grep -Eq '\(NEEDED\).*\[(liblog4cplus|libc\+\+_shared)\.so\]' \
              <<< "$consumer_dynamic"; then
            echo 'Static consumer unexpectedly has a shared log4cplus or libc++ dependency' >&2
            exit 1
          fi
