version: 2.2.1.{build}-{branch}

install:
    # Keep the VS 2017 compiler while updating the runner's older CMake.
    - ps: |
        $ErrorActionPreference = 'Stop'
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        $cmakeVersion = '3.31.12'
        $cmakeArchive = "cmake-$cmakeVersion-windows-x86_64.zip"
        $cmakeZip = Join-Path $env:TEMP $cmakeArchive
        $cmakeRoot = Join-Path $env:APPVEYOR_BUILD_FOLDER '.appveyor-cmake'
        Invoke-WebRequest -UseBasicParsing "https://github.com/Kitware/CMake/releases/download/v$cmakeVersion/$cmakeArchive" -OutFile $cmakeZip
        Expand-Archive -Path $cmakeZip -DestinationPath $cmakeRoot
        $env:PATH = "$cmakeRoot\cmake-$cmakeVersion-windows-x86_64\bin;$env:PATH"
    - cmake --version
    - ctest --version
    - git submodule update --init --recursive

environment:
  matrix:
    # GitHub-hosted Windows images do not include the VS 2017 v141 toolset.
    - PRJ_GEN: "Visual Studio 15 2017"
      APPVEYOR_BUILD_WORKER_IMAGE: "Visual Studio 2017"
      BDIR: msvc2017
      PRJ_CFG: Release

build_script:
  - mkdir build.%BDIR%
  - cd build.%BDIR%
  - cmake .. -G "%PRJ_GEN%" -A x64 "-DCMAKE_BUILD_TYPE=%PRJ_CFG%" %PARAMS%
  - cmake --build . --config "%PRJ_CFG%" --clean-first

test_script:
  - ctest -V --output-on-failure -C %PRJ_CFG%
